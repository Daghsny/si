<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sti Hub - Content Details</title>
    <link rel="icon" type="image/x-icon" href="assets/stiLogo-01.png" />
    
    <!-- Google Fonts: Bricolage Grotesque + Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <a href="index.html" class="nav-brand" title="Sti Hub">
                <i class="ph-fill ph-student"></i>
            </a>

            <div class="nav-links">
                <a href="index.html" class="nav-link" id="nav-home" title="Home">
                    <i class="ph-bold ph-house"></i>
                </a>
                <a href="index.html" class="nav-link active" title="Courses">
                    <i class="ph-bold ph-books"></i>
                </a>
                <a href="calendar.html" class="nav-link" id="nav-calendar" title="Calendar">
                    <i class="ph-bold ph-calendar-blank"></i>
                </a>
                <a href="profile.html" class="nav-link" id="nav-info" title="Info">
                    <i class="ph-bold ph-info"></i>
                </a>
            </div>
        </nav>

        <!-- View Container: Content Detail -->
        <div id="content-view" class="view-container"
            style="grid-column: 2 / -1; padding: var(--sp-lg) 2.5rem; overflow-y: auto; height: 100vh;">

            <header class="top-header mobile-view-header" style="margin-bottom: 2rem;">
                <div class="mobile-header-row">
                    <div class="mobile-brand">
                        <button id="menu-toggle" class="menu-toggle">
                            <i class="ph-bold ph-list"></i>
                        </button>
                        <h6 id="detailTitle" style="font-size: 1.4rem;">Course Details</h1>
                    </div>
                    <a href="index.html" class="ho-btn-ghost" style="padding: 0.5rem 0.9rem;">
                        <i class="ph-bold ph-house"></i>
                        <span>Home</span>
                    </a>
                </div>
            </header>

            <main style="max-width: 850px; margin: 0 auto;">
                <div id="detailContainer" class="course-card" style="cursor: default; padding: 2.5rem;">
                    <!-- Content injected by JS -->
                    <p style="text-align: center; color: var(--text-secondary);">Loading content...</p>
                </div>
            </main>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/mobile_menu.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id && typeof renderContentDetail === 'function') {
                renderContentDetail(id);
            } else if (typeof renderContentDetail === 'function') {
                renderContentDetail(1);
            }
        });
    </script>
</body>

</html>
